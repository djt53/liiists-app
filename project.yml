name: liiists
options:
  bundleIdPrefix: com.davidtingle
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 7
    DEVELOPMENT_TEAM: 8HZAKZWFY8
    CODE_SIGN_STYLE: Automatic

targets:
  liiists:
    type: application
    platform: iOS
    sources:
      - liiists
    resources:
      - liiists/Resources
      - liiists/Assets.xcassets
    info:
      path: liiists/Info.plist
      properties:
        UIAppFonts:
          - Doto-Variable.ttf
          - SpaceGrotesk-Variable.ttf
          - SpaceMono-Regular.ttf
          - SpaceMono-Bold.ttf
        UILaunchScreen: {}
        NSUbiquitousContainers:
          iCloud.com.davidtingle.liiists:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerSupportedFolderLevels: None
            NSUbiquitousContainerName: liiists
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: ShareExtension
    entitlements:
      path: liiists/liiists.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.davidtingle.liiists
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.davidtingle.liiists
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.davidtingle.liiists

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - path: liiists/Models
        group: Shared
      - path: liiists/Services/MarkdownParser.swift
        group: Shared
      - path: liiists/Services/SharedContainer.swift
        group: Shared
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.davidtingle.liiists
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.davidtingle.liiists
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: liiists Share
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidtingle.liiists.ShareExtension
        SKIP_INSTALL: YES

  liiistsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - liiistsTests
    dependencies:
      - target: liiists
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.davidtingle.liiistsTests
