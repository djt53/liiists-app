name: liiists
options:
  bundleIdPrefix: com.davidtingle
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.3.1"
    CURRENT_PROJECT_VERSION: 67
    DEVELOPMENT_TEAM: 8HZAKZWFY8
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"

packages:
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.0.0"

targets:
  liiists:
    type: application
    platform: iOS
    sources:
      - liiists
    resources:
      - liiists/Resources
      - liiists/Assets.xcassets
    info:
      path: liiists/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UIAppFonts:
          - Doto-Variable.ttf
          - SpaceGrotesk-Variable.ttf
          - SpaceMono-Regular.ttf
          - SpaceMono-Bold.ttf
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - liiists
            CFBundleURLName: com.davidtingle.liiists
        NSUbiquitousContainers:
          iCloud.com.davidtingle.liiists:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerSupportedFolderLevels: None
            NSUbiquitousContainerName: liiists
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: ShareExtension
      - target: LiiistsWidget
      - target: liiistsWatch
        embed: true
      - package: PostHog
    entitlements:
      path: liiists/liiists.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.davidtingle.liiists
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.davidtingle.liiists
        com.apple.developer.icloud-services:
          - CloudKit
          - CloudDocuments
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.davidtingle.liiists
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.associated-domains:
          - applinks:davidtingle.com
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.davidtingle.liiists

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - path: liiists/Models
        group: Shared
      - path: liiists/Services/MarkdownParser.swift
        group: Shared
      - path: liiists/Services/SharedContainer.swift
        group: Shared
      - path: liiists/Services/Analytics.swift
        group: Shared
    dependencies:
      - package: PostHog
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.davidtingle.liiists
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.davidtingle.liiists
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: liiists Share
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.davidtingle.liiists.ShareExtension
        SKIP_INSTALL: YES

  LiiistsWidget:
    type: app-extension
    platform: iOS
    sources:
      - LiiistsWidget
      - path: liiists/Models
        group: Shared
      - path: liiists/Services/MarkdownParser.swift
        group: Shared
      - path: liiists/Services/SharedContainer.swift
        group: Shared
      - path: liiists/Services/IntentListStore.swift
        group: Shared
      - path: liiists/Services/StreakStats.swift
        group: Shared
      - liiists/Theme.swift
    resources:
      - path: liiists/Resources/Fonts/SpaceGrotesk-Variable.ttf
      - path: liiists/Resources/Fonts/SpaceMono-Regular.ttf
      - path: liiists/Resources/Fonts/SpaceMono-Bold.ttf
    entitlements:
      path: LiiistsWidget/LiiistsWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.davidtingle.liiists
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.davidtingle.liiists
    info:
      path: LiiistsWidget/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: liiists Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.davidtingle.liiists.LiiistsWidget
        SKIP_INSTALL: YES

  liiistsWatch:
    type: application
    platform: watchOS
    dependencies:
      - target: liiistsWatchWidgets
        embed: true
    sources:
      - liiistsWatch
      - path: liiists/Services/WatchPayload.swift
        group: Shared
      - path: liiists/Services/WatchCatalog.swift
        group: Shared
      - liiists/Theme.swift
    resources:
      - liiistsWatch/Assets.xcassets
      - path: liiists/Resources/Fonts/Doto-Variable.ttf
      - path: liiists/Resources/Fonts/SpaceGrotesk-Variable.ttf
      - path: liiists/Resources/Fonts/SpaceMono-Regular.ttf
      - path: liiists/Resources/Fonts/SpaceMono-Bold.ttf
    info:
      path: liiistsWatch/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: liiists
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.davidtingle.liiists
        UIAppFonts:
          - Doto-Variable.ttf
          - SpaceGrotesk-Variable.ttf
          - SpaceMono-Regular.ttf
          - SpaceMono-Bold.ttf
    entitlements:
      path: liiistsWatch/liiistsWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.davidtingle.liiists
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "4"
        PRODUCT_BUNDLE_IDENTIFIER: com.davidtingle.liiists.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES

  liiistsWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - liiistsWatchWidgets
      - path: liiists/Services/WatchCatalog.swift
        group: Shared
      - liiists/Theme.swift
    resources:
      - path: liiists/Resources/Fonts/SpaceGrotesk-Variable.ttf
      - path: liiists/Resources/Fonts/SpaceMono-Regular.ttf
      - path: liiists/Resources/Fonts/SpaceMono-Bold.ttf
    entitlements:
      path: liiistsWatchWidgets/liiistsWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.davidtingle.liiists
    info:
      path: liiistsWatchWidgets/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: liiists Watch Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "4"
        PRODUCT_BUNDLE_IDENTIFIER: com.davidtingle.liiists.watchkitapp.widgets
        SKIP_INSTALL: YES

  liiistsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - liiistsTests
    dependencies:
      - target: liiists
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.davidtingle.liiistsTests
